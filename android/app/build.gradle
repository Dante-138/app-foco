apply plugin: 'com.android.application'

// Assinatura do APK de release.
// A chave e a senha ficam fora do repositório. O build recebe só o caminho de um
// arquivo de propriedades, com -Pfoco.assinatura=<arquivo> (modelo em
// docker/android/assinatura.properties.exemplo). Nada do conteúdo é impresso.
def arquivoDeAssinatura = providers.gradleProperty('foco.assinatura').orNull
def assinatura = new Properties()
if (arquivoDeAssinatura) {
    file(arquivoDeAssinatura).withInputStream { assinatura.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { campo ->
        if (!assinatura.getProperty(campo)) {
            throw new GradleException("Arquivo de assinatura sem o campo obrigatório: ${campo}")
        }
    }
}

// Sem assinatura, o Gradle geraria um APK de release que não instala. Melhor falhar cedo.
// Exceção: -Pfoco.semAssinatura=true gera o APK sem assinar de propósito. É o build do CI da
// release, que não tem nenhum segredo; outro job assina o arquivo depois (zipalign e apksigner).
def semAssinatura = providers.gradleProperty('foco.semAssinatura').orNull == 'true'
def pediuRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (semAssinatura && arquivoDeAssinatura) {
    throw new GradleException('-Pfoco.semAssinatura=true e -Pfoco.assinatura não andam juntos')
}
if (pediuRelease && !arquivoDeAssinatura && !semAssinatura) {
    throw new GradleException('Build de release exige -Pfoco.assinatura=<arquivo de propriedades da assinatura>')
}

android {
    namespace = "io.github.dante138.foco"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (arquivoDeAssinatura) {
                storeFile file(assinatura.getProperty('storeFile'))
                storePassword assinatura.getProperty('storePassword')
                keyAlias assinatura.getProperty('keyAlias')
                keyPassword assinatura.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId "io.github.dante138.foco"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // A versão é a do package.json; o release-please troca as duas a cada release (pela
        // marca no fim da linha). O versionCode sai dela: 1.2.3 vira 10203, e cresce a cada
        // versão nova, como o Android exige para atualizar sem desinstalar.
        def versao = "0.1.0" // x-release-please-version
        def (maior, menor, correcao) = versao.tokenize('.').collect { it.toInteger() }
        if (menor > 99 || correcao > 99) throw new GradleException("Versão ${versao}: o versionCode só cabe com menor e correção até 99")
        versionCode maior * 10000 + menor * 100 + correcao
        versionName versao
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // O build de depuração usa a mesma chave quando ela é informada. Assim ele
        // instala por cima do app de release (e vice-versa) sem apagar os dados.
        debug {
            if (arquivoDeAssinatura) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (arquivoDeAssinatura) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
