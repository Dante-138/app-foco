name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A proteção da branch main exige este job verde para liberar o merge.
  # Trocar o nome dele exige atualizar a proteção.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions fixadas pelo hash do commit, não por tag (que pode ser reapontada).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o portão de commits compara com a branch de destino
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: nenhuma dependência roda código na instalação.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Mensagens de commit e título do PR
        if: github.event_name == 'pull_request'
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.base_ref }}
        run: node tools/verificar-commits.mjs "$BASE"

      # test.only, .skip, "c8 ignore", "Stryker disable", eslint-disable e afins: desligam um
      # portão sem mudar a configuração dele.
      - name: Rotas de fuga
        run: npm run escapes

      - name: Lint (zero avisos)
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes de unidade (100% de cobertura do núcleo)
        run: npm test

      - name: Testes de ponta a ponta (Chrome)
        run: npm run test:e2e

  # Compila o projeto Android para garantir que a casca continua montando.
  # Usa a chave de depuração do runner: este APK não é publicado. O APK assinado
  # com a chave fixa sai do build local (tools/apk.ps1).
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Copiar o app web para o projeto Android
        run: npx cap sync android

      - name: Carimbar o build (versão, commit e data em Ajustes)
        run: node tools/carimbar-build.mjs

      - name: Compilar o APK de depuração
        working-directory: android
        run: sh ./gradlew --no-daemon --console=plain assembleDebug

      # O mesmo build que o workflow Release faz, sem assinar: confere que o modo sem assinatura
      # continua montando antes de uma release depender dele.
      - name: Compilar o APK de release sem assinatura
        working-directory: android
        run: sh ./gradlew --no-daemon --console=plain assembleRelease -Pfoco.semAssinatura=true

      # APK de PR: o mesmo código, como um app à parte ("Foco PR", sufixo .pr) e com dados de
      # demonstração, para testar a mudança no celular sem tocar nos dados de verdade. Assinado
      # com a chave de depuração do runner, que muda a cada rodada: para instalar um por cima do
      # outro, desinstale antes (adb uninstall io.github.dante138.foco.pr).
      - name: Pôr os dados de demonstração na cópia do app
        if: github.event_name == 'pull_request'
        run: node tools/dados-de-demonstracao.mjs

      - name: Compilar o APK de PR
        if: github.event_name == 'pull_request'
        working-directory: android
        env:
          NUMERO_DO_PR: ${{ github.event.pull_request.number }}
        run: |
          sh ./gradlew --no-daemon --console=plain assembleDebug -Pfoco.variante=pr
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/foco-pr-$NUMERO_DO_PR.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: foco-pr-${{ github.event.pull_request.number }}
          path: foco-pr-${{ github.event.pull_request.number }}.apk
          if-no-files-found: error
          retention-days: 7
