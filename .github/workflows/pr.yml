name: PR

# Regras do próprio pull request, que não dependem do código.
# Roda também quando o PR é editado ("edited"), porque a base pode ser trocada depois de aberto.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

# Este workflow não lê o repositório nem escreve nada.
permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Todo PR entra pela main: uma mudança por vez, sem pilha de PRs.
  # Mesclar um PR em outra branch não passa pela proteção da main, e a mudança fica fora dela.
  base:
    name: Base
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: A base do PR é a main
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error title=Base errada::Este PR aponta para '$BASE'. Todo PR tem a main como base: uma mudança por vez, sem pilha."
            exit 1
          fi
          echo "Base: main."

  # Com o merge por squash, o título do PR vira o assunto do commit na main e a descrição vira o
  # corpo. O job Gate confere o título quando chega commit; este confere os dois também quando
  # são editados depois, que é quando o Gate não roda. Também passa os commits e o texto do PR
  # pela lista de termos proibidos: o GitHub guarda os commits de todo PR para sempre.
  titulo:
    name: Título
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # os commits do PR, comparados com a main
          persist-credentials: false

      # TERMOS_PROIBIDOS vem de um secret: a lista de termos não pode ficar pública. Por isso o
      # verificador que roda aqui é o da main, já revisado, e não o do PR: um PR que mudasse o
      # script poderia mandar o secret para fora. Mudança no verificador vale neste job depois do
      # merge; antes disso, os testes de unidade do Gate conferem a versão do PR. Sem o secret
      # (PR do Dependabot, por exemplo), a lista fica vazia e o resto das regras vale igual.
      # O script não tem dependências: roda com o Node que já vem na máquina do Actions.
      - name: Título, descrição e commits do PR
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
          CORPO_PR: ${{ github.event.pull_request.body }}
          TERMOS_PROIBIDOS: ${{ secrets.TERMOS_PROIBIDOS }}
          BASE: origin/${{ github.base_ref }}
        run: |
          verificador="$RUNNER_TEMP/verificar-commits.mjs"
          git show origin/main:tools/verificar-commits.mjs > "$verificador"
          resultado=0
          node "$verificador" --pr || resultado=1
          node "$verificador" "$BASE" || resultado=1
          exit "$resultado"
